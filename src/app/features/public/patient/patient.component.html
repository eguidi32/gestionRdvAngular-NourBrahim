<div class="container-fluid py-4">
  <div class="row">
    <!-- Formulaire principal -->
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <!-- Titre -->
          <h1 class="h4 mb-4">
            <i class="fas fa-user-plus me-2"></i>
            Créer un Nouveau Patient
          </h1>

          <form>
            <div class="row">
              <!-- Numéro Patient -->
              <div class="col-md-6 mb-3">
                <label for="numeroPatient" class="form-label">
                  <i class="fas fa-hashtag me-1"></i>
                  Numéro Patient
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="numeroPatient"
                  value="PAT-001"
                  readonly
                />
              </div>

              <!-- Nom -->
              <div class="col-md-6 mb-3">
                <label for="nom" class="form-label">
                  <i class="fas fa-user me-1"></i>
                  Nom
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="nom"
                  placeholder="Dupont"
                />
              </div>

              <!-- Prénom -->
              <div class="col-md-6 mb-3">
                <label for="prenom" class="form-label">
                  <i class="fas fa-user me-1"></i>
                  Prénom
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="prenom"
                  placeholder="Jean"
                />
              </div>

              <!-- Téléphone -->
              <div class="col-md-6 mb-3">
                <label for="telephone" class="form-label">
                  <i class="fas fa-phone me-1"></i>
                  Téléphone
                </label>
                <input
                  type="tel"
                  class="form-control"
                  id="telephone"
                  placeholder="+221 77 123 45 67"
                />
              </div>

              <!-- Adresse -->
              <div class="col-12 mb-3">
                <label for="adresse" class="form-label">
                  <i class="fas fa-map-marker-alt me-1"></i>
                  Adresse
                </label>
                <textarea
                  class="form-control"
                  id="adresse"
                  rows="2"
                  placeholder="Rue, Code postal, Ville"
                ></textarea>
              </div>

              <!-- Antécédents Médicaux -->
              <div class="col-12 mb-3">
                <label for="antecedents" class="form-label">
                  <i class="fas fa-notes-medical me-1"></i>
                  Antécédents Médicaux
                </label>
                <textarea
                  class="form-control"
                  id="antecedents"
                  rows="4"
                  placeholder="Décrivez vos antécédents médicaux, allergies, maladies chroniques..."
                ></textarea>
              </div>
            </div>

            <!-- Boutons d'action -->
            <div class="d-flex gap-2 justify-content-end mt-4">
              <button type="button" class="btn btn-secondary">
                <i class="fas fa-times me-1"></i>
                Annuler
              </button>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-check me-1"></i>
                Créer Patient
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Panneau d'informations -->
    <div class="col-lg-4">
      <div class="card border-0 border-start border-primary border-4 bg-light">
        <div class="card-body p-4">
          <h5 class="card-title">
            <i class="fas fa-info-circle text-primary me-2"></i>
            Informations
          </h5>
          <p class="card-text text-muted small mb-3">
            Veuillez remplir tous les champs avec les informations correctes du
            patient.
          </p>

          <h6 class="fw-semibold mb-3">Champs requis:</h6>
          <ul class="list-unstyled">
            <li class="mb-2">
              <i class="fas fa-check-circle text-success me-2"></i>
              <span class="text-muted">Numéro Patient</span>
            </li>
            <li class="mb-2">
              <i class="fas fa-check-circle text-success me-2"></i>
              <span class="text-muted">Nom</span>
            </li>
            <li class="mb-2">
              <i class="fas fa-check-circle text-success me-2"></i>
              <span class="text-muted">Prénom</span>
            </li>
            <li class="mb-2">
              <i class="fas fa-check-circle text-success me-2"></i>
              <span class="text-muted">Téléphone</span>
            </li>
            <li class="mb-2">
              <i class="fas fa-check-circle text-success me-2"></i>
              <span class="text-muted">Adresse</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
